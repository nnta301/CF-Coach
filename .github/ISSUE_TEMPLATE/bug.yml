name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Provide enough evidence for another team member to reproduce and investigate the problem.

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence of steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, browser, commit, or other relevant context.
      placeholder: Windows 11, Python 3.11, commit abc123
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, stack traces, screenshots, or links when available.